{% extends 'portal/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-6 text-center">
        <div class="card p-5 border-0 shadow-sm bg-card">
            <div class="text-success mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                </svg>
            </div>
            
            <h3 class="fw-bold mb-3">Registration Plan Submitted!</h3>
            <p class="text-muted mb-5">Your course registration plan was submitted successfully. The courses are currently pending approval by your academic advisor.</p>
            
            <div class="d-flex gap-3 justify-content-center">
                <a href="{% url 'student_dashboard' %}" class="btn btn-primary px-4">Return to Dashboard</a>
                <a href="{% url 'schedule' %}" class="btn btn-outline-secondary px-4">View Timetable</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
